<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .locator{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
      .result{fill:#fff3e0;stroke:#e65100;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 1000 505" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">Locator 比较：判断数据是否已处理的逻辑</text>
  <text class="muted" x="40" y="66">通过 IsFasterThan() 比较两个 Locator，判断数据是否已处理，避免重复处理。</text>

  <rect class="locator" x="40" y="95" width="400" height="150"/>
  <text class="h" x="70" y="130">Locator A</text>
  <text class="t" x="70" y="155">timestamp: 100</text>
  <text class="t" x="70" y="175">hashId: 0, 1</text>
  <text class="t" x="70" y="195">处理到 timestamp=100</text>
  <text class="t" x="70" y="215">的数据</text>
  <text class="t" x="70" y="235">包含 2 个分片</text>

  <path class="arrow" d="M 440 170 L 500 170"/>
  <text class="muted" x="470" y="165" text-anchor="middle">IsFasterThan()</text>

  <rect class="locator" x="510" y="95" width="400" height="150"/>
  <text class="h" x="540" y="130">Locator B</text>
  <text class="t" x="540" y="155">timestamp: 200</text>
  <text class="t" x="540" y="175">hashId: 0, 1, 2</text>
  <text class="t" x="540" y="195">处理到 timestamp=200</text>
  <text class="t" x="540" y="215">的数据</text>
  <text class="t" x="540" y="235">包含 3 个分片</text>

  <rect class="result" x="40" y="265" width="870" height="200"/>
  <text class="h" x="70" y="300">比较结果：LCR_FULLY_FASTER</text>
  <text class="t" x="70" y="325">B 比 A 快（FULLY_FASTER），说明：</text>
  <text class="t" x="90" y="350">- B 的 timestamp (200) > A 的 timestamp (100)</text>
  <text class="t" x="90" y="370">- B 包含 A 的所有 hashId (0, 1)</text>
  <text class="t" x="90" y="390">- B 还包含额外的 hashId (2)</text>
  <text class="t" x="70" y="415">结论：B 包含 A 的所有数据，A 的数据已经处理过，可以跳过</text>
  <text class="t" x="70" y="435">应用：增量更新时，如果新 Locator 比旧 Locator 快，说明数据已处理，可以跳过</text>
  <text class="t" x="70" y="455">优势：避免重复处理数据，保证数据一致性，支持多数据源场景</text>
</svg>
