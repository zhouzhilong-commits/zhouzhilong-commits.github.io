<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540.0">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .pruning{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 1000 540.0" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">查询剪枝：减少不必要的查询</text>
  <text class="muted" x="40" y="66">查询剪枝通过提前判断和过滤，减少不必要的查询操作，提高查询性能。</text>

  <rect class="pruning" x="40" y="95" width="220" height="200"/>
  <text class="h" x="70" y="130">查询分析</text>
  <text class="t" x="70" y="155">分析查询条件</text>
  <text class="t" x="70" y="175">判断查询类型</text>
  <text class="t" x="70" y="195">评估查询复杂度</text>
  <text class="t" x="70" y="215">预测查询成本</text>
  <text class="t" x="70" y="235">决定是否剪枝</text>
  <text class="t" x="70" y="255">减少查询开销</text>

  <path class="arrow" d="M 260 195 L 300 195"/>
  <text class="t" x="270" y="190">剪枝</text>

  <rect class="pruning" x="320" y="95" width="220" height="200"/>
  <text class="h" x="350" y="130">Segment 剪枝</text>
  <text class="t" x="350" y="155">跳过不相关 Segment</text>
  <text class="t" x="350" y="175">根据查询条件</text>
  <text class="t" x="350" y="195">过滤 Segment</text>
  <text class="t" x="350" y="215">减少查询范围</text>
  <text class="t" x="350" y="235">提高查询效率</text>
  <text class="t" x="350" y="255">降低查询延迟</text>

  <path class="arrow" d="M 540 195 L 580 195"/>
  <text class="t" x="550" y="190">优化</text>

  <rect class="pruning" x="600" y="95" width="360" height="200"/>
  <text class="h" x="630" y="130">索引剪枝</text>
  <text class="t" x="630" y="155">跳过不相关索引</text>
  <text class="t" x="630" y="175">根据查询字段</text>
  <text class="t" x="630" y="195">过滤索引类型</text>
  <text class="t" x="630" y="215">减少索引访问</text>
  <text class="t" x="630" y="235">提高查询效率</text>
  <text class="t" x="630" y="255">降低查询延迟</text>

  <rect class="box" x="40" y="315" width="920" height="195.0"/>
  <text class="h" x="70" y="350">查询剪枝的关键策略</text>
  <text class="t" x="70" y="375">1. 查询分析：通过分析查询条件、判断查询类型、评估查询复杂度、预测查询成本，决定是否进行剪枝，减少查询开销</text>
  <text class="t" x="70" y="395">2. Segment 剪枝：通过跳过不相关的 Segment，根据查询条件过滤 Segment，减少查询范围，提高查询效率，降低查询延迟</text>
  <text class="t" x="70" y="415">3. 索引剪枝：通过跳过不相关的索引，根据查询字段过滤索引类型，减少索引访问，提高查询效率，降低查询延迟</text>
  <text class="t" x="70" y="435">关键设计：查询剪枝通过查询分析、Segment 剪枝、索引剪枝等策略，全面减少不必要的查询操作，提高查询性能</text>
  <text class="t" x="70" y="455">关键设计：查询剪枝需要合理评估剪枝的成本和收益，避免过度剪枝导致查询结果不准确</text>

  <text class="muted" x="40" y="490">理解查询剪枝，是优化查询性能的关键</text>
</svg>
