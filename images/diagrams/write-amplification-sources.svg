<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:12}
      .title{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .text{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect class="box" x="30" y="95" width="150" height="90"/>
  <text class="title" x="105" y="128" text-anchor="middle">应用写入</text>
  <text class="text" x="105" y="155" text-anchor="middle">逻辑写入 1×</text>

  <path class="arrow" d="M 185 140 L 255 140"/>

  <rect class="box" x="260" y="35" width="170" height="90"/>
  <text class="title" x="345" y="68" text-anchor="middle">WAL / 日志</text>
  <text class="text" x="345" y="95" text-anchor="middle">额外写入 1×</text>
  <text class="muted" x="345" y="114" text-anchor="middle">（持久性 / 恢复）</text>

  <rect class="box" x="260" y="155" width="170" height="90"/>
  <text class="title" x="345" y="188" text-anchor="middle">数据结构</text>
  <text class="text" x="345" y="215" text-anchor="middle">MemTable / Page</text>
  <text class="muted" x="345" y="234" text-anchor="middle">（排序 / 索引）</text>

  <path class="arrow" d="M 430 80 L 520 80"/>
  <path class="arrow" d="M 430 200 L 520 200"/>

  <rect class="box" x="525" y="35" width="190" height="90"/>
  <text class="title" x="620" y="68" text-anchor="middle">Flush / 落盘</text>
  <text class="text" x="620" y="95" text-anchor="middle">写出 SST / Page</text>
  <text class="muted" x="620" y="114" text-anchor="middle">（顺序写 / IO）</text>

  <rect class="box" x="525" y="155" width="190" height="90"/>
  <text class="title" x="620" y="188" text-anchor="middle">索引/元数据</text>
  <text class="text" x="620" y="215" text-anchor="middle">index / filter /</text>
  <text class="text" x="620" y="235" text-anchor="middle">manifest ...</text>

  <path class="arrow" d="M 715 80 L 805 80"/>
  <path class="arrow" d="M 715 200 L 805 200"/>

  <rect class="box" x="810" y="35" width="140" height="210"/>
  <text class="title" x="880" y="70" text-anchor="middle">后台重写</text>
  <text class="text" x="880" y="105" text-anchor="middle">Compaction</text>
  <text class="text" x="880" y="130" text-anchor="middle">Merge / GC</text>
  <text class="muted" x="880" y="165" text-anchor="middle">（反复合并）</text>
  <text class="muted" x="880" y="185" text-anchor="middle">（删除回收）</text>

  <text class="muted" x="30" y="265">写放大：系统实际写入字节 / 用户逻辑写入字节（把 WAL、索引、合并重写都算上）</text>
</svg>

