<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .async{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
      .concurrent{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2;rx:12}
    </style>
  </defs>

  <text class="title" x="40" y="42">构建流程的异步与并发：提高吞吐量</text>
  <text class="muted" x="40" y="66">构建流程通过异步和并发机制提高系统吞吐量。</text>

  <rect class="async" x="40" y="95" width="220" height="200"/>
  <text class="h" x="70" y="130">异步机制</text>
  <text class="t" x="70" y="155">异步转储</text>
  <text class="t" x="70" y="175">不阻塞写入</text>
  <text class="t" x="70" y="195">提高吞吐量</text>
  <text class="t" x="70" y="215">并行执行</text>
  <text class="t" x="70" y="235">资源控制</text>
  <text class="t" x="70" y="255">并发控制</text>
  <text class="t" x="70" y="275">提高效率</text>

  <rect class="concurrent" x="280" y="95" width="220" height="200"/>
  <text class="h" x="310" y="130">并发机制</text>
  <text class="t" x="310" y="155">并发写入</text>
  <text class="t" x="310" y="175">多线程构建</text>
  <text class="t" x="310" y="195">提高吞吐量</text>
  <text class="t" x="310" y="215">并行处理</text>
  <text class="t" x="310" y="235">资源控制</text>
  <text class="t" x="310" y="255">并发控制</text>
  <text class="t" x="310" y="275">提高效率</text>

  <rect class="box" x="520" y="95" width="440" height="200"/>
  <text class="h" x="550" y="130">异步与并发的协同</text>
  <text class="t" x="550" y="155">异步转储 + 并发写入</text>
  <text class="t" x="550" y="175">提高系统吞吐量</text>
  <text class="t" x="550" y="195">并行执行</text>
  <text class="t" x="550" y="215">资源控制</text>
  <text class="t" x="550" y="235">并发控制</text>
  <text class="t" x="550" y="255">提高效率</text>
  <text class="t" x="550" y="275">优化性能</text>

  <rect class="box" x="40" y="315" width="920" height="160"/>
  <text class="h" x="70" y="350">异步与并发机制的关键设计</text>
  <text class="t" x="70" y="375">1. 异步机制：通过异步转储机制，转储过程不阻塞写入，写入线程和转储线程并行执行，提高系统吞吐量</text>
  <text class="t" x="70" y="395">2. 并发机制：通过并发写入机制，多个线程可以同时写入不同的 MemSegment，提高写入吞吐量</text>
  <text class="t" x="70" y="415">3. 资源控制：通过内存配额和并发控制，控制转储任务和写入任务的并发度，避免资源竞争，保证系统稳定性</text>
  <text class="t" x="70" y="435">关键设计：异步与并发机制通过并行执行、资源控制、并发控制等策略，全面提高系统吞吐量和性能</text>
  <text class="t" x="70" y="455">关键设计：异步与并发机制需要合理控制并发度，避免资源竞争，保证系统稳定性和性能</text>

  <text class="muted" x="40" y="490">理解异步与并发机制，是优化索引构建性能的关键</text>
</svg>
