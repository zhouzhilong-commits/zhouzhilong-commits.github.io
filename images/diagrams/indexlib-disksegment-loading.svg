<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .normal{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
      .lazy{fill:#fff3e0;stroke:#e65100;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">DiskSegment 加载策略：NORMAL vs LAZY 模式</text>
  <text class="muted" x="40" y="66">NORMAL 模式立即加载所有索引，LAZY 模式按需加载，节省内存。</text>

  <rect class="normal" x="40" y="95" width="420" height="319.0"/>
  <text class="h" x="70" y="130">NORMAL 模式</text>
  <text class="t" x="70" y="155">OpenMode::NORMAL</text>
  <text class="t" x="70" y="180">特点：</text>
  <text class="t" x="90" y="205">- 立即加载所有索引</text>
  <text class="t" x="90" y="225">- 倒排索引、正排索引</text>
  <text class="t" x="90" y="245">- 摘要、属性等</text>
  <text class="t" x="70" y="270">适用场景：</text>
  <text class="t" x="90" y="295">- 在线查询服务</text>
  <text class="t" x="90" y="315">- 需要低延迟查询</text>
  <text class="t" x="90" y="335">- 内存充足</text>
  <text class="t" x="70" y="360">优势：查询延迟低，无需等待加载</text>
  <text class="t" x="70" y="380">劣势：内存占用大，启动时间长</text>

  <rect class="lazy" x="480" y="95" width="480" height="319.0"/>
  <text class="h" x="510" y="130">LAZY 模式</text>
  <text class="t" x="510" y="155">OpenMode::LAZY</text>
  <text class="t" x="510" y="180">特点：</text>
  <text class="t" x="530" y="205">- 按需加载索引</text>
  <text class="t" x="530" y="225">- 查询时才加载</text>
  <text class="t" x="530" y="245">- 可以卸载不用的索引</text>
  <text class="t" x="510" y="270">适用场景：</text>
  <text class="t" x="530" y="295">- 离线处理</text>
  <text class="t" x="530" y="315">- 内存受限</text>
  <text class="t" x="530" y="335">- 部分索引查询</text>
  <text class="t" x="510" y="360">优势：内存占用小，可以处理大量 Segment</text>
  <text class="t" x="510" y="380">劣势：首次查询需要加载，可能有延迟</text>
</svg>
