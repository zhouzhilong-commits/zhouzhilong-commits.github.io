<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000.0 512.0">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .json{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
      .query{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 1000.0 512.0" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">查询解析：从 JSON 到内部查询对象</text>
  <text class="muted" x="40" y="66">查询解析将 JSON 格式的查询转换为内部查询对象，提取查询类型、查询条件等信息。</text>

  <rect class="json" x="40" y="95" width="280" height="214.0"/>
  <text class="h" x="70" y="130">JSON 查询</text>
  <text class="t" x="70" y="155">{</text>
  <text class="t" x="90" y="175">"query": "term:hello",</text>
  <text class="t" x="90" y="195">"indexType": "inverted",</text>
  <text class="t" x="90" y="215">"indexName": "title",</text>
  <text class="t" x="90" y="235">"filter": {...},</text>
  <text class="t" x="90" y="255">"sort": [...]</text>
  <text class="t" x="70" y="275">}</text>

  <path class="arrow" d="M 320 195 L 360 195"/>

  <rect class="query" x="380" y="95" width="580" height="234.0"/>
  <text class="h" x="410" y="130">内部查询对象</text>
  <text class="t" x="410" y="155">Query {</text>
  <text class="t" x="430" y="175">    queryType: TERM_QUERY,</text>
  <text class="t" x="430" y="195">    indexType: "inverted",</text>
  <text class="t" x="430" y="215">    indexName: "title",</text>
  <text class="t" x="430" y="235">    term: "hello",</text>
  <text class="t" x="430" y="255">    filter: Filter {...},</text>
  <text class="t" x="430" y="275">    sort: Sort [...]</text>
  <text class="t" x="410" y="295">}</text>

  <rect class="box" x="40" y="315" width="920" height="157.0"/>
  <text class="h" x="70" y="350">查询解析的关键步骤</text>
  <text class="t" x="70" y="375">1. 解析 JSON：解析 JSON 格式的查询字符串，提取各个字段</text>
  <text class="t" x="70" y="395">2. 提取查询类型：提取查询类型（term 查询、范围查询、逻辑查询等）</text>
  <text class="t" x="70" y="415">3. 提取查询条件：提取查询条件（term、范围、过滤条件等）</text>
  <text class="t" x="70" y="435">4. 创建查询对象：创建内部查询对象，包含查询类型、条件、排序等信息</text>

  <text class="muted" x="40" y="440">查询解析是查询流程的第一步，需要正确解析 JSON 查询并转换为内部查询对象</text>
</svg>
