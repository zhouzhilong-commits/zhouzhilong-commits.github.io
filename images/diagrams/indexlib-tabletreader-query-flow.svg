<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .step{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 1000 545" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">TabletReader 查询流程：从 JSON 查询到结果返回</text>
  <text class="muted" x="40" y="66">查询流程包括解析、获取 IndexReader、遍历 Segment、合并结果等步骤。</text>

  <rect class="step" x="40" y="95" width="160" height="120.0"/>
  <text class="h" x="70" y="130">1. 解析查询</text>
  <text class="t" x="70" y="155">JSON → 查询对象</text>
  <text class="t" x="70" y="175">提取索引类型</text>
  <text class="t" x="70" y="195">和名称</text>

  <path class="arrow" d="M 200 145 L 240 145"/>

  <rect class="step" x="250" y="95" width="180" height="120.0"/>
  <text class="h" x="280" y="130">2. 获取 IndexReader</text>
  <text class="t" x="280" y="155">从 _indexReaderMap</text>
  <text class="t" x="280" y="175">获取或创建</text>
  <text class="t" x="280" y="195">缓存机制</text>

  <path class="arrow" d="M 430 145 L 470 145"/>

  <rect class="step" x="480" y="95" width="180" height="120.0"/>
  <text class="h" x="510" y="130">3. 遍历 Segment</text>
  <text class="t" x="510" y="155">TabletData-></text>
  <text class="t" x="510" y="175">CreateSlice(ST_BUILT)</text>
  <text class="t" x="510" y="195">获取所有已构建 Segment</text>

  <path class="arrow" d="M 660 145 L 700 145"/>

  <rect class="step" x="710" y="95" width="160" height="120.0"/>
  <text class="h" x="740" y="130">4. 并行查询</text>
  <text class="t" x="740" y="155">对每个 Segment</text>
  <text class="t" x="740" y="175">调用 Indexer</text>
  <text class="t" x="740" y="195">查询</text>

  <path class="arrow" d="M 870 145 L 910 145"/>

  <rect class="step" x="40" y="215" width="160" height="120.0"/>
  <text class="h" x="70" y="250">5. 合并结果</text>
  <text class="t" x="70" y="275">去重、排序</text>
  <text class="t" x="70" y="295">聚合统计</text>
  <text class="t" x="70" y="315">分页处理</text>

  <path class="arrow" d="M 200 265 L 240 265"/>

  <rect class="step" x="250" y="215" width="160" height="100"/>
  <text class="h" x="280" y="250">6. 返回结果</text>
  <text class="t" x="280" y="275">序列化为 JSON</text>
  <text class="t" x="280" y="295">返回给调用者</text>

  <rect class="box" x="430" y="215" width="440" height="300.0"/>
  <text class="h" x="460" y="250">关键代码逻辑</text>
  <text class="t" x="460" y="275">// 1. 解析查询</text>
  <text class="t" x="460" y="295">Query query = ParseJsonQuery(jsonQuery);</text>
  <text class="t" x="460" y="315">// 2. 获取 IndexReader（带缓存）</text>
  <text class="t" x="460" y="335">auto reader = GetIndexReader(</text>
  <text class="t" x="480" y="355">    query.indexType, query.indexName);</text>
  <text class="t" x="460" y="375">// 3. 获取所有已构建的 Segment</text>
  <text class="t" x="460" y="395">auto segments = tabletData-></text>
  <text class="t" x="480" y="415">    CreateSlice(ST_BUILT);</text>
  <text class="t" x="460" y="435">// 4. 遍历 Segment 查询并合并结果</text>
  <text class="t" x="460" y="455">for (auto&amp; seg : segments) {</text>
  <text class="t" x="480" y="475">    results.merge(reader->Search(seg));</text>
  <text class="t" x="480" y="495">}</text>
</svg>
