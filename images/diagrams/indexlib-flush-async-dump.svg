<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .async{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
      .write{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">异步转储机制：不阻塞写入，提高吞吐量</text>
  <text class="muted" x="40" y="66">异步转储允许在转储过程中继续接收新的写入，提高系统吞吐量。</text>

  <rect class="write" x="40" y="95" width="280" height="200"/>
  <text class="h" x="70" y="130">写入线程</text>
  <text class="t" x="70" y="155">继续接收文档</text>
  <text class="t" x="70" y="175">写入新的 MemSegment</text>
  <text class="t" x="70" y="195">不阻塞</text>
  <text class="t" x="70" y="215">高吞吐量</text>
  <text class="t" x="70" y="235">并行执行</text>
  <text class="t" x="70" y="255">提高性能</text>
  <text class="t" x="70" y="275">用户体验好</text>

  <path class="arrow" d="M 320 195 L 360 195"/>
  <text class="t" x="330" y="190">并行</text>

  <rect class="async" x="380" y="95" width="280" height="200"/>
  <text class="h" x="410" y="130">转储线程</text>
  <text class="t" x="410" y="155">异步转储</text>
  <text class="t" x="410" y="175">MemSegment 到 DiskSegment</text>
  <text class="t" x="410" y="195">后台执行</text>
  <text class="t" x="410" y="215">不阻塞写入</text>
  <text class="t" x="410" y="235">资源控制</text>
  <text class="t" x="410" y="255">并发控制</text>
  <text class="t" x="410" y="275">提高效率</text>

  <path class="arrow" d="M 660 195 L 700 195"/>
  <text class="t" x="670" y="190">完成</text>

  <rect class="box" x="720" y="95" width="240" height="200"/>
  <text class="h" x="750" y="130">DiskSegment</text>
  <text class="t" x="750" y="155">转储完成</text>
  <text class="t" x="750" y="175">创建 DiskSegment</text>
  <text class="t" x="750" y="195">持久化存储</text>
  <text class="t" x="750" y="215">可以查询</text>
  <text class="t" x="750" y="235">准备合并</text>
  <text class="t" x="750" y="255">释放内存</text>
  <text class="t" x="750" y="275">提高性能</text>

  <rect class="box" x="40" y="315" width="920" height="220"/>
  <text class="h" x="70" y="350">异步转储机制的关键设计</text>
  <text class="t" x="70" y="375">1. 并行执行：写入线程和转储线程并行执行，写入线程继续接收文档并写入新的 MemSegment，转储线程在后台异步转储旧的 MemSegment</text>
  <text class="t" x="70" y="395">2. 不阻塞写入：转储过程不阻塞新的写入，系统可以持续接收文档，提高吞吐量和用户体验</text>
  <text class="t" x="70" y="415">3. 资源控制：通过 DumpControl 控制转储任务的并发度，避免资源竞争，保证系统稳定性</text>
  <text class="t" x="70" y="435">4. 内存管理：转储完成后释放 MemSegment 的内存，创建 DiskSegment 用于查询，提高内存利用率</text>
  <text class="t" x="70" y="455">关键设计：异步转储机制通过并行执行、不阻塞写入、资源控制、内存管理等策略，全面提高系统吞吐量和性能</text>
  <text class="t" x="70" y="475">关键设计：异步转储机制需要合理控制转储任务的并发度，避免资源竞争，保证系统稳定性和性能</text>
  <text class="t" x="70" y="495">关键设计：异步转储机制需要合理估算转储所需的内存，避免内存不足导致转储失败或系统性能下降</text>
  <text class="t" x="70" y="515">关键设计：异步转储机制需要合理控制转储任务的优先级，保证写入任务的优先级高于转储任务，避免影响写入性能</text>

  <text class="muted" x="40" y="550">理解异步转储机制，是优化索引构建性能的关键</text>
</svg>
