<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000.0 612.0">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .step{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 1000.0 612.0" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">实时写入场景：从 Build 到 Commit 的完整流程</text>
  <text class="muted" x="40" y="66">实时写入场景展示了从接收文档到提交版本的完整流程。</text>

  <rect class="step" x="40" y="95" width="180" height="129.0"/>
  <text class="h" x="70" y="125">1. Build</text>
  <text class="t" x="70" y="150">接收文档批次</text>
  <text class="t" x="70" y="170">写入 MemSegment</text>
  <text class="t" x="70" y="190.0">持续构建</text>

  <path class="arrow" d="M 220 145 L 260 145"/>
  <text class="t" x="230" y="150.0">触发</text>

  <rect class="step" x="280" y="95" width="180" height="129.0"/>
  <text class="h" x="310" y="125">2. Flush</text>
  <text class="t" x="310" y="150">转储 MemSegment</text>
  <text class="t" x="310" y="170">创建 DiskSegment</text>
  <text class="t" x="310" y="190.0">异步执行</text>

  <path class="arrow" d="M 460 145 L 500 145"/>
  <text class="t" x="470" y="150.0">准备</text>

  <rect class="step" x="520" y="95" width="180" height="129.0"/>
  <text class="h" x="550" y="125">3. Seal</text>
  <text class="t" x="550" y="150">封存 Segment</text>
  <text class="t" x="550" y="170">标记为只读</text>
  <text class="t" x="550" y="190.0">准备合并</text>

  <path class="arrow" d="M 700 145 L 740 145"/>
  <text class="t" x="710" y="150.0">提交</text>

  <rect class="step" x="760" y="95" width="200" height="129.0"/>
  <text class="h" x="790" y="125">4. Commit</text>
  <text class="t" x="790" y="150">提交新版本</text>
  <text class="t" x="790" y="170">更新 Version</text>
  <text class="t" x="790" y="190.0">持久化</text>

  <rect class="box" x="40" y="215" width="920" height="357.0"/>
  <text class="h" x="70" y="250">实时写入场景的关键特点</text>
  <text class="t" x="70" y="275">1. Build 阶段：持续接收文档批次，将文档写入 MemSegment，持续构建索引，支持实时写入</text>
  <text class="t" x="70" y="295">2. Flush 阶段：当 MemSegment 达到一定大小或触发条件时，异步转储 MemSegment 到 DiskSegment，不阻塞写入</text>
  <text class="t" x="70" y="315">3. Seal 阶段：当需要提交版本时，封存当前的 MemSegment，标记为只读，准备合并，不再接收新文档</text>
  <text class="t" x="70" y="335">4. Commit 阶段：提交新版本，更新 Version，持久化到磁盘，新版本可以用于查询</text>
  <text class="t" x="70" y="355">关键设计：实时写入场景需要保证低延迟，从接收文档到可查询的时间应该尽可能短</text>
  <text class="t" x="70" y="375">关键设计：实时写入场景需要保证高吞吐量，系统可以持续接收大量文档并构建索引</text>
  <text class="t" x="70" y="395">关键设计：实时写入场景需要保证数据一致性，版本提交应该保证原子性，新版本包含所有已提交的数据</text>
  <text class="t" x="70" y="415">关键设计：实时写入场景需要保证系统稳定性，内存使用应该合理，避免内存不足导致系统性能下降</text>
  <text class="t" x="70" y="435">关键设计：实时写入场景需要支持增量更新，新版本应该包含旧版本的所有数据，加上新增的数据</text>
  <text class="t" x="70" y="455">关键设计：实时写入场景需要支持版本管理，可以查询不同版本的数据，支持版本回滚</text>
  <text class="t" x="70" y="475">关键设计：实时写入场景需要支持并发写入，多个线程可以同时写入不同的 MemSegment，提高写入吞吐量</text>
  <text class="t" x="70" y="495">关键设计：实时写入场景需要支持异步转储，转储过程不阻塞写入，提高系统吞吐量和性能</text>
  <text class="t" x="70" y="515">关键设计：实时写入场景需要支持资源控制，通过内存配额控制转储任务的并发度，避免资源竞争</text>

  <text class="muted" x="40" y="540">理解实时写入场景，是优化索引构建性能的关键</text>
</svg>
