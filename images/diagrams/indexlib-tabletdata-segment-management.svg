<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .op{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 1000 505" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">TabletData Segment 列表维护：添加、移除、更新</text>
  <text class="muted" x="40" y="66">TabletData 通过 Init() 初始化，通过 TabletWriter 添加新 Segment，合并后移除旧 Segment。</text>

  <rect class="op" x="40" y="95" width="200" height="120"/>
  <text class="h" x="70" y="130">1. Init</text>
  <text class="t" x="70" y="155">初始化 Segment 列表</text>
  <text class="t" x="70" y="175">设置 Version</text>
  <text class="t" x="70" y="195">加载已有 Segment</text>

  <path class="arrow" d="M 240 155 L 280 155"/>

  <rect class="op" x="290" y="95" width="200" height="120"/>
  <text class="h" x="320" y="130">2. 添加 Segment</text>
  <text class="t" x="320" y="155">TabletWriter 创建</text>
  <text class="t" x="320" y="175">MemSegment</text>
  <text class="t" x="320" y="195">添加到列表</text>

  <path class="arrow" d="M 490 155 L 530 155"/>

  <rect class="op" x="550" y="95" width="200" height="120"/>
  <text class="h" x="580" y="130">3. 转储</text>
  <text class="t" x="580" y="155">MemSegment →</text>
  <text class="t" x="580" y="175">DiskSegment</text>
  <text class="t" x="580" y="195">更新列表</text>

  <path class="arrow" d="M 750 155 L 790 155"/>

  <rect class="op" x="800" y="95" width="160" height="120"/>
  <text class="h" x="830" y="130">4. 合并</text>
  <text class="t" x="830" y="155">多个 Segment</text>
  <text class="t" x="830" y="175">合并为一个</text>
  <text class="t" x="830" y="195">移除旧 Segment</text>

  <rect class="box" x="40" y="235" width="920" height="240"/>
  <text class="h" x="70" y="270">详细说明</text>
  <text class="t" x="70" y="295">1. Init：TabletData::Init() 初始化 Segment 列表，从 Version 加载已存在的 Segment，设置 _onDiskVersion</text>
  <text class="t" x="70" y="315">2. 添加 Segment：TabletWriter 创建新的 MemSegment 后，通过 TabletData 的内部机制添加到 _segments 列表</text>
  <text class="t" x="70" y="335">3. 转储：MemSegment 转储为 DiskSegment 后，Segment 列表中的 MemSegment 被 DiskSegment 替代，状态更新为 ST_BUILT</text>
  <text class="t" x="70" y="355">4. 合并：合并操作创建新的合并 Segment，旧 Segment 从列表中移除，新 Segment 添加到列表，Version 更新</text>
  <text class="t" x="70" y="375">5. Reopen：重新打开时，TabletData 根据新 Version 更新 Segment 列表，加载新的 Segment，卸载不再需要的 Segment</text>
  <text class="t" x="70" y="395">6. 资源回收：通过 ReclaimSegmentResource() 回收不再使用的 Segment 的资源（内存、文件句柄等）</text>
  <text class="t" x="70" y="415">关键点：Segment 列表始终保持有序（按 SegmentId 排序），保证 DocId 映射的正确性</text>
  <text class="t" x="70" y="435">关键点：Segment 的添加和移除是原子操作，保证查询时的一致性</text>
  <text class="t" x="70" y="455">关键点：通过智能指针管理 Segment 的生命周期，自动释放资源</text>
</svg>
