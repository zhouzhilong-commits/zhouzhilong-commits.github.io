<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:12}
      .title{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .text{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .danger{fill:#fff5f5;stroke:#c0392b;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">WAL + 恢复：最小闭环</text>
  <text class="muted" x="40" y="66">目标：返回成功的写入在崩溃后仍可恢复；尾部半写可被识别并截断。</text>

  <rect class="box" x="40" y="95" width="170" height="90"/>
  <text class="title" x="125" y="128" text-anchor="middle">1) 追加 WAL</text>
  <text class="muted" x="125" y="152" text-anchor="middle">顺序写 + 校验</text>
  <text class="muted" x="125" y="170" text-anchor="middle">LSN/seq 单调</text>

  <path class="arrow" d="M 210 140 L 280 140"/>

  <rect class="box" x="285" y="95" width="170" height="90"/>
  <text class="title" x="370" y="128" text-anchor="middle">2) fsync?</text>
  <text class="muted" x="370" y="152" text-anchor="middle">强持久：每次/批量</text>
  <text class="muted" x="370" y="170" text-anchor="middle">弱持久：允许窗口</text>

  <path class="arrow" d="M 455 140 L 525 140"/>

  <rect class="box" x="530" y="95" width="190" height="90"/>
  <text class="title" x="625" y="128" text-anchor="middle">3) 应用到内存结构</text>
  <text class="muted" x="625" y="152" text-anchor="middle">MemTable / page cache</text>
  <text class="muted" x="625" y="170" text-anchor="middle">对外可见（写成功）</text>

  <path class="arrow" d="M 720 140 L 790 140"/>

  <rect class="box" x="795" y="95" width="145" height="90"/>
  <text class="title" x="868" y="128" text-anchor="middle">4) Checkpoint</text>
  <text class="muted" x="868" y="152" text-anchor="middle">落盘结构 + 元数据</text>
  <text class="muted" x="868" y="170" text-anchor="middle">推进截断点</text>

  <rect class="danger" x="80" y="220" width="820" height="70"/>
  <text class="title" x="490" y="252" text-anchor="middle">崩溃恢复</text>
  <text class="text" x="490" y="276" text-anchor="middle">启动：扫描 WAL → 找到最后一条校验正确的记录 → 截断尾部 → 从截断点后重放 → 重建内存状态</text>
</svg>

