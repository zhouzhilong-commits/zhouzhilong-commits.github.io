<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000.0 612.0">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .step{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 1000.0 612.0" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">全文检索场景：从 term 查询到结果返回</text>
  <text class="muted" x="40" y="66">全文检索场景展示了从 term 查询到结果返回的完整流程。</text>

  <rect class="step" x="40" y="95" width="180" height="129.0"/>
  <text class="h" x="70" y="125">1. 解析查询</text>
  <text class="t" x="70" y="150">提取 term</text>
  <text class="t" x="70" y="170">创建查询对象</text>
  <text class="t" x="70" y="190.0">准备查询</text>

  <path class="arrow" d="M 220 145 L 260 145"/>
  <text class="t" x="230" y="150.0">查询</text>

  <rect class="step" x="280" y="95" width="180" height="129.0"/>
  <text class="h" x="310" y="125">2. 倒排索引查询</text>
  <text class="t" x="310" y="150">查找 term</text>
  <text class="t" x="310" y="170">获取倒排列表</text>
  <text class="t" x="310" y="190.0">获取 DocId 列表</text>

  <path class="arrow" d="M 460 145 L 500 145"/>
  <text class="t" x="470" y="150.0">过滤</text>

  <rect class="step" x="520" y="95" width="180" height="129.0"/>
  <text class="h" x="550" y="125">3. 过滤删除文档</text>
  <text class="t" x="550" y="150">通过 DeletionMap</text>
  <text class="t" x="550" y="170">过滤已删除文档</text>
  <text class="t" x="550" y="190.0">获取有效 DocId</text>

  <path class="arrow" d="M 700 145 L 740 145"/>
  <text class="t" x="710" y="150.0">合并</text>

  <rect class="step" x="760" y="95" width="200" height="129.0"/>
  <text class="h" x="790" y="125">4. 合并结果</text>
  <text class="t" x="790" y="150">合并各 Segment 结果</text>
  <text class="t" x="790" y="170">去重、排序</text>
  <text class="t" x="790" y="190.0">返回结果</text>

  <rect class="box" x="40" y="215" width="920" height="357.0"/>
  <text class="h" x="70" y="250">全文检索场景的关键特点</text>
  <text class="t" x="70" y="275">1. 解析查询：提取 term，创建查询对象，准备查询，支持多 term 查询、短语查询等</text>
  <text class="t" x="70" y="295">2. 倒排索引查询：在倒排索引中查找 term，获取倒排列表，获取 DocId 列表，支持多字段查询</text>
  <text class="t" x="70" y="315">3. 过滤删除文档：通过 DeletionMap 过滤已删除文档，获取有效 DocId，保证查询结果的准确性</text>
  <text class="t" x="70" y="335">4. 合并结果：合并各 Segment 的查询结果，去重、排序，返回最相关的文档，支持分页</text>
  <text class="t" x="70" y="355">关键设计：全文检索场景需要支持多 term 查询、短语查询、多字段查询等复杂查询类型</text>
  <text class="t" x="70" y="375">关键设计：全文检索场景需要支持相关性排序，返回最相关的文档，提高用户体验</text>
  <text class="t" x="70" y="395">关键设计：全文检索场景需要支持高并发查询，多个查询可以并行执行，提高查询吞吐量</text>
  <text class="t" x="70" y="415">关键设计：全文检索场景需要支持查询缓存，缓存查询结果，减少重复查询，提高查询性能</text>
  <text class="t" x="70" y="435">关键设计：全文检索场景需要支持查询优化，通过查询剪枝、索引剪枝等策略，减少不必要的查询操作</text>
  <text class="t" x="70" y="455">关键设计：全文检索场景需要支持查询监控，监控查询性能，及时发现性能问题，优化查询性能</text>
  <text class="t" x="70" y="475">关键设计：全文检索场景需要支持查询统计，统计查询次数、查询延迟、查询命中率等指标，帮助优化查询性能</text>
  <text class="t" x="70" y="495">关键设计：全文检索场景需要支持查询日志，记录查询详情，帮助定位和解决问题</text>
  <text class="t" x="70" y="515">关键设计：全文检索场景需要支持查询限流，控制查询并发度，避免系统过载，保证系统稳定性</text>

  <text class="muted" x="40" y="540">理解全文检索场景，是优化查询性能的关键</text>
</svg>
