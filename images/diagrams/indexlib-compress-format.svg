<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .format{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
    </style>
  </defs>

  <text class="title" x="40" y="42">压缩格式：支持多种压缩算法</text>
  <text class="muted" x="40" y="66">IndexLib 支持多种压缩格式，包括 LZ4、Zstd、Snappy、Gzip 等，不同的压缩算法有不同的特点。</text>

  <rect class="format" x="40" y="95" width="220" height="200"/>
  <text class="h" x="70" y="130">LZ4</text>
  <text class="t" x="70" y="155">快速压缩算法</text>
  <text class="t" x="70" y="175">- 压缩速度快</text>
  <text class="t" x="70" y="195">- 解压速度快</text>
  <text class="t" x="70" y="215">- 压缩率中等</text>
  <text class="t" x="70" y="235">适用于实时场景</text>
  <text class="t" x="70" y="255">性能优先</text>
  <text class="t" x="70" y="275">延迟低</text>

  <rect class="format" x="280" y="95" width="220" height="200"/>
  <text class="h" x="310" y="130">Zstd</text>
  <text class="t" x="310" y="155">高效压缩算法</text>
  <text class="t" x="310" y="175">- 压缩率高</text>
  <text class="t" x="310" y="195">- 压缩速度中等</text>
  <text class="t" x="310" y="215">- 解压速度快</text>
  <text class="t" x="310" y="235">适用于存储优化</text>
  <text class="t" x="310" y="255">压缩率优先</text>
  <text class="t" x="310" y="275">存储空间小</text>

  <rect class="format" x="520" y="95" width="220" height="200"/>
  <text class="h" x="550" y="130">Snappy</text>
  <text class="t" x="550" y="155">快速压缩算法</text>
  <text class="t" x="550" y="175">- 压缩速度快</text>
  <text class="t" x="550" y="195">- 解压速度快</text>
  <text class="t" x="550" y="215">- 压缩率低</text>
  <text class="t" x="550" y="235">适用于高性能场景</text>
  <text class="t" x="550" y="255">性能优先</text>
  <text class="t" x="550" y="275">延迟最低</text>

  <rect class="format" x="760" y="95" width="200" height="200"/>
  <text class="h" x="790" y="130">Gzip</text>
  <text class="t" x="790" y="155">通用压缩算法</text>
  <text class="t" x="790" y="175">- 压缩率高</text>
  <text class="t" x="790" y="195">- 兼容性好</text>
  <text class="t" x="790" y="215">- 压缩速度慢</text>
  <text class="t" x="790" y="235">适用于兼容性场景</text>
  <text class="t" x="790" y="255">兼容性优先</text>
  <text class="t" x="790" y="275">通用性好</text>

  <rect class="box" x="40" y="315" width="920" height="160"/>
  <text class="h" x="70" y="350">压缩格式的关键特点</text>
  <text class="t" x="70" y="375">1. LZ4：快速压缩算法，压缩速度快，解压速度快，压缩率中等，适用于实时场景，性能优先</text>
  <text class="t" x="70" y="395">2. Zstd：高效压缩算法，压缩率高，压缩速度中等，解压速度快，适用于存储优化，压缩率优先</text>
  <text class="t" x="70" y="415">3. Snappy：快速压缩算法，压缩速度快，解压速度快，压缩率低，适用于高性能场景，性能优先</text>
  <text class="t" x="70" y="435">4. Gzip：通用压缩算法，压缩率高，兼容性好，压缩速度慢，适用于兼容性场景，兼容性优先</text>
  <text class="t" x="70" y="455">关键设计：不同的压缩格式适用于不同的场景，需要根据实际需求选择合适的压缩格式</text>
  <text class="t" x="70" y="475">关键设计：压缩格式支持配置，可以通过配置选择不同的压缩算法，灵活适应不同场景</text>

  <text class="muted" x="40" y="490">理解压缩格式，是选择合适的压缩算法的关键</text>
</svg>
