<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .v1{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
      .v2{fill:#fff3e0;stroke:#e65100;stroke-width:2;rx:12}
      .v3{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">Version 演进：从 V1 到 V2 的版本变化</text>
  <text class="muted" x="40" y="66">每次 Commit 时创建新版本，VersionId 递增，Segments 和 Locator 更新。</text>

  <rect class="v1" x="40" y="95" width="280" height="300"/>
  <text class="h" x="70" y="130">Version 1</text>
  <text class="t" x="70" y="155">VersionId: 1</text>
  <text class="t" x="70" y="180">Segments:</text>
  <text class="t" x="90" y="205">- Segment 1</text>
  <text class="t" x="90" y="225">- Segment 2</text>
  <text class="t" x="70" y="250">Locator:</text>
  <text class="t" x="90" y="275">timestamp: 100</text>
  <text class="t" x="90" y="295">hashId: 0, 1</text>
  <text class="t" x="70" y="320">状态：初始版本</text>
  <text class="t" x="70" y="340">包含 2 个 Segment</text>
  <text class="t" x="70" y="360">处理到 timestamp=100</text>
  <text class="t" x="70" y="380">的数据</text>

  <path class="arrow" d="M 320 245 L 360 245"/>
  <text class="muted" x="340" y="240" text-anchor="middle">Commit</text>

  <rect class="v2" x="370" y="95" width="280" height="300"/>
  <text class="h" x="400" y="130">Version 2</text>
  <text class="t" x="400" y="155">VersionId: 2</text>
  <text class="t" x="400" y="180">Segments:</text>
  <text class="t" x="420" y="205">- Segment 1</text>
  <text class="t" x="420" y="225">- Segment 2</text>
  <text class="t" x="420" y="245">- Segment 3 (新增)</text>
  <text class="t" x="400" y="270">Locator:</text>
  <text class="t" x="420" y="295">timestamp: 200</text>
  <text class="t" x="420" y="315">hashId: 0, 1, 2</text>
  <text class="t" x="400" y="340">状态：新增 Segment</text>
  <text class="t" x="400" y="360">包含 3 个 Segment</text>
  <text class="t" x="400" y="380">处理到 timestamp=200</text>

  <path class="arrow" d="M 650 245 L 690 245"/>
  <text class="muted" x="670" y="240" text-anchor="middle">Merge</text>

  <rect class="v3" x="700" y="95" width="280" height="300"/>
  <text class="h" x="730" y="130">Version 3</text>
  <text class="t" x="730" y="155">VersionId: 3</text>
  <text class="t" x="730" y="180">Segments:</text>
  <text class="t" x="750" y="205">- Segment 4 (合并)</text>
  <text class="t" x="750" y="225">- Segment 3</text>
  <text class="t" x="730" y="250">Locator:</text>
  <text class="t" x="750" y="275">timestamp: 300</text>
  <text class="t" x="750" y="295">hashId: 0, 1, 2</text>
  <text class="t" x="730" y="320">状态：合并后</text>
  <text class="t" x="730" y="340">Segment 1+2 合并为 4</text>
  <text class="t" x="730" y="360">处理到 timestamp=300</text>
</svg>
