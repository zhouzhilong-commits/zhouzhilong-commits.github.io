<!-- Mermaid.js for diagram rendering -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  // Initialize Mermaid
  mermaid.initialize({ 
    startOnLoad: false,  // We'll manually initialize after processing code blocks
    theme: 'default',
    flowchart: {
      useMaxWidth: true,
      htmlLabels: true,
      curve: 'basis'
    },
    sequence: {
      diagramMarginX: 50,
      diagramMarginY: 10,
      actorMargin: 50,
      width: 150,
      height: 65,
      boxMargin: 10,
      boxTextMargin: 5,
      noteMargin: 10,
      messageMargin: 35,
      mirrorActors: true,
      bottomMarginAdj: 1,
      useMaxWidth: true,
      rightAngles: false,
      showSequenceNumbers: false
    },
    state: {
      useMaxWidth: true
    }
  });

  // Process mermaid code blocks after page load
  document.addEventListener('DOMContentLoaded', function() {
    // Find all code blocks with language-mermaid or containing mermaid
    const codeBlocks = document.querySelectorAll('code.language-mermaid, code[class*="mermaid"]');
    
    codeBlocks.forEach(function(codeBlock) {
      // Get the parent pre element
      const pre = codeBlock.parentElement;
      if (pre && pre.tagName === 'PRE') {
        // Create a div for mermaid
        const mermaidDiv = document.createElement('div');
        mermaidDiv.className = 'mermaid';
        mermaidDiv.textContent = codeBlock.textContent;
        
        // Replace the pre element with the mermaid div
        pre.parentNode.replaceChild(mermaidDiv, pre);
      }
    });
    
    // Also check for pre > code structure that might have mermaid content
    const allPreCode = document.querySelectorAll('pre > code');
    allPreCode.forEach(function(code) {
      const pre = code.parentElement;
      // Check if the code block contains mermaid syntax
      const codeText = code.textContent.trim();
      if (codeText && (
        codeText.startsWith('graph ') || 
        codeText.startsWith('sequenceDiagram') ||
        codeText.startsWith('stateDiagram') ||
        codeText.startsWith('classDiagram') ||
        code.classList.contains('language-mermaid')
      )) {
        // Check if parent pre has class indicating mermaid
        if (pre.classList.contains('language-mermaid') || 
            code.classList.contains('language-mermaid') ||
            codeText.match(/^(graph|sequenceDiagram|stateDiagram|classDiagram|erDiagram|gantt|pie|gitgraph|journey|requirement)/)) {
          const mermaidDiv = document.createElement('div');
          mermaidDiv.className = 'mermaid';
          mermaidDiv.textContent = codeText;
          pre.parentNode.replaceChild(mermaidDiv, pre);
        }
      }
    });
    
    // Initialize Mermaid after processing
    mermaid.run();
  });
</script>
