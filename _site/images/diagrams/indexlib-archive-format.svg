<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .archive{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
    </style>
  </defs>

  <text class="title" x="40" y="42">Archive 格式：归档存储格式的特点和应用</text>
  <text class="muted" x="40" y="66">Archive 格式将文件归档存储，支持文件压缩、文件索引、文件追加等功能。</text>

  <rect class="archive" x="40" y="95" width="920" height="320"/>
  <text class="h" x="70" y="130">Archive 格式</text>

  <rect class="box" x="70" y="155" width="400" height="240"/>
  <text class="h" x="90" y="180">Archive 文件结构</text>
  <text class="t" x="90" y="205">- 文件头：元数据信息</text>
  <text class="t" x="90" y="225">- 文件索引：文件位置索引</text>
  <text class="t" x="90" y="245">- 文件数据：压缩的文件数据</text>
  <text class="t" x="90" y="265">- 文件尾：校验和等信息</text>
  <text class="t" x="90" y="285">支持文件压缩</text>
  <text class="t" x="90" y="305">支持文件索引</text>
  <text class="t" x="90" y="325">支持文件追加</text>
  <text class="t" x="90" y="345">支持快速定位</text>
  <text class="t" x="90" y="365">支持数据校验</text>
  <text class="t" x="90" y="385">支持版本管理</text>

  <rect class="box" x="490" y="155" width="450" height="240"/>
  <text class="h" x="510" y="180">Archive 格式的关键特点</text>
  <text class="t" x="510" y="205">1. 文件归档：将文件归档存储，支持文件压缩，减少存储空间</text>
  <text class="t" x="510" y="225">2. 文件索引：支持文件索引，快速定位文件，提高访问效率</text>
  <text class="t" x="510" y="245">3. 文件追加：支持追加文件到归档，支持增量更新</text>
  <text class="t" x="510" y="265">4. 数据校验：支持数据校验，保证数据完整性</text>
  <text class="t" x="510" y="285">5. 版本管理：支持版本管理，支持多版本归档</text>
  <text class="t" x="510" y="305">关键设计：Archive 格式支持文件压缩，减少存储空间，提高存储效率</text>
  <text class="t" x="510" y="325">关键设计：Archive 格式支持文件索引，快速定位文件，提高访问效率</text>
  <text class="t" x="510" y="345">关键设计：Archive 格式支持文件追加，支持增量更新，提高更新效率</text>
  <text class="t" x="510" y="365">关键设计：Archive 格式支持数据校验，保证数据完整性，提高可靠性</text>
  <text class="t" x="510" y="385">关键设计：Archive 格式支持版本管理，支持多版本归档，提高管理效率</text>

  <text class="muted" x="40" y="430">Archive 格式是归档存储的关键，支持文件压缩、索引、追加等功能</text>
</svg>
