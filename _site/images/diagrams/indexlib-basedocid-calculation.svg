<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .segment{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
      .calc{fill:#fff3e0;stroke:#e65100;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">BaseDocId 计算：前面所有 Segment 的文档数之和</text>
  <text class="muted" x="40" y="66">BaseDocId 是 Segment 的全局 DocId 起始值，用于全局 DocId 到局部 DocId 的转换。</text>

  <rect class="segment" x="40" y="95" width="180" height="160.0"/>
  <text class="h" x="70" y="130">Segment 1</text>
  <text class="t" x="70" y="155">docCount: 1000</text>
  <text class="t" x="70" y="175">baseDocId: 0</text>
  <text class="t" x="70" y="195">计算：0</text>
  <text class="t" x="70" y="215">（第一个 Segment）</text>
  <text class="t" x="70" y="235">全局 DocId: 0-999</text>

  <path class="arrow" d="M 220 170 L 260 170"/>

  <rect class="segment" x="270" y="95" width="180" height="160.0"/>
  <text class="h" x="300" y="130">Segment 2</text>
  <text class="t" x="300" y="155">docCount: 2000</text>
  <text class="t" x="300" y="175">baseDocId: 1000</text>
  <text class="t" x="300" y="195">计算：0 + 1000</text>
  <text class="t" x="300" y="215">= 1000</text>
  <text class="t" x="300" y="235">全局 DocId: 1000-2999</text>

  <path class="arrow" d="M 450 170 L 490 170"/>

  <rect class="segment" x="500" y="95" width="180" height="160.0"/>
  <text class="h" x="530" y="130">Segment 3</text>
  <text class="t" x="530" y="155">docCount: 1500</text>
  <text class="t" x="530" y="175">baseDocId: 3000</text>
  <text class="t" x="530" y="195">计算：0 + 1000</text>
  <text class="t" x="530" y="215">+ 2000 = 3000</text>
  <text class="t" x="530" y="235">全局 DocId: 3000-4499</text>

  <rect class="calc" x="40" y="265" width="640" height="200"/>
  <text class="h" x="70" y="300">代码实现逻辑（TabletData::GetSegmentWithBaseDocid）</text>
  <text class="t" x="70" y="325">docid64_t baseDocId = 0;</text>
  <text class="t" x="70" y="345">for (auto&amp; seg : _segments) {</text>
  <text class="t" x="90" y="365">    if (seg->GetSegmentId() == segmentId) {</text>
  <text class="t" x="110" y="385">        return std::make_pair(seg, baseDocId);</text>
  <text class="t" x="90" y="405">    }</text>
  <text class="t" x="90" y="425">    baseDocId += seg->GetDocCount();</text>
  <text class="t" x="110" y="445">    // 累加前面 Segment 的 docCount</text>
  <text class="t" x="70" y="445">}</text>

  <rect class="box" x="700" y="265" width="260" height="200"/>
  <text class="h" x="730" y="300">关键点</text>
  <text class="t" x="730" y="325">- Segment 列表有序</text>
  <text class="t" x="730" y="345">- 遍历前面的 Segment</text>
  <text class="t" x="730" y="365">- 累加 docCount</text>
  <text class="t" x="730" y="385">- 返回 baseDocId</text>
  <text class="t" x="730" y="405">- 时间复杂度：O(n)</text>
  <text class="t" x="730" y="425">- 可以优化为 O(1)</text>
  <text class="t" x="730" y="445">（缓存 baseDocId）</text>
</svg>
