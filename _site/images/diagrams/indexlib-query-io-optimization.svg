<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000.0 562.0">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .io{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
    </style>
  </defs>

  <text class="title" x="40" y="42">查询 IO 优化：批量读取、预读等</text>
  <text class="muted" x="40" y="66">查询 IO 优化通过批量读取、预读等策略，减少 IO 次数，提高查询性能。</text>

  <rect class="io" x="40" y="95" width="220" height="200"/>
  <text class="h" x="70" y="130">批量读取</text>
  <text class="t" x="70" y="155">批量读取数据</text>
  <text class="t" x="70" y="175">减少 IO 次数</text>
  <text class="t" x="70" y="195">提高 IO 效率</text>
  <text class="t" x="70" y="215">减少系统调用</text>
  <text class="t" x="70" y="235">提高吞吐量</text>
  <text class="t" x="70" y="255">降低延迟</text>

  <rect class="io" x="280" y="95" width="220" height="200"/>
  <text class="h" x="310" y="130">预读机制</text>
  <text class="t" x="310" y="155">预测访问模式</text>
  <text class="t" x="310" y="175">提前读取数据</text>
  <text class="t" x="310" y="195">减少读取延迟</text>
  <text class="t" x="310" y="215">提高查询性能</text>
  <text class="t" x="310" y="235">优化用户体验</text>
  <text class="t" x="310" y="255">降低延迟</text>

  <rect class="io" x="520" y="95" width="220" height="200"/>
  <text class="h" x="550" y="130">IO 合并</text>
  <text class="t" x="550" y="155">合并多个 IO</text>
  <text class="t" x="550" y="175">减少 IO 开销</text>
  <text class="t" x="550" y="195">提高 IO 效率</text>
  <text class="t" x="550" y="215">减少系统调用</text>
  <text class="t" x="550" y="235">提高吞吐量</text>
  <text class="t" x="550" y="255">降低延迟</text>

  <rect class="io" x="760" y="95" width="200" height="200"/>
  <text class="h" x="790" y="130">异步 IO</text>
  <text class="t" x="790" y="155">异步读取数据</text>
  <text class="t" x="790" y="175">提高并发度</text>
  <text class="t" x="790" y="195">减少阻塞</text>
  <text class="t" x="790" y="215">提高吞吐量</text>
  <text class="t" x="790" y="235">优化性能</text>
  <text class="t" x="790" y="255">降低延迟</text>

  <rect class="box" x="40" y="315" width="920" height="207.0"/>
  <text class="h" x="70" y="350">查询 IO 优化的关键策略</text>
  <text class="t" x="70" y="375">1. 批量读取：通过批量读取数据，减少 IO 次数，提高 IO 效率，减少系统调用，提高吞吐量，降低延迟</text>
  <text class="t" x="70" y="395">2. 预读机制：通过预测访问模式，提前读取数据，减少读取延迟，提高查询性能，优化用户体验，降低延迟</text>
  <text class="t" x="70" y="415">3. IO 合并：通过合并多个 IO 操作，减少 IO 开销，提高 IO 效率，减少系统调用，提高吞吐量，降低延迟</text>
  <text class="t" x="70" y="435">关键设计：查询 IO 优化通过批量读取、预读机制、IO 合并、异步 IO 等策略，全面减少 IO 次数和提高 IO 效率</text>
  <text class="t" x="70" y="455">关键设计：查询 IO 优化需要合理配置 IO 策略，平衡 IO 效率和资源使用</text>

  <text class="muted" x="40" y="490">理解查询 IO 优化，是提高查询性能的关键</text>
</svg>
