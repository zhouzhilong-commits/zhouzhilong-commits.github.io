<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .fence{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
      .atomic{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2;rx:12}
    </style>
  </defs>

  <text class="title" x="40" y="42">版本管理的原子性：通过 Fence 机制保证版本提交的原子性</text>
  <text class="muted" x="40" y="66">版本管理的原子性通过 Fence 机制保证，要么全部成功，要么全部失败，保证版本提交的一致性。</text>

  <rect class="fence" x="40" y="95" width="280" height="200"/>
  <text class="h" x="70" y="130">Fence 机制</text>
  <text class="t" x="70" y="155">1. 创建 Fence 目录</text>
  <text class="t" x="70" y="175">创建临时目录</text>
  <text class="t" x="70" y="195">fence_xxx/</text>
  <text class="t" x="70" y="215">2. 写入 Version</text>
  <text class="t" x="70" y="235">写入 Fence 目录</text>
  <text class="t" x="70" y="255">version.0 文件</text>
  <text class="t" x="70" y="275">3. 原子切换</text>
  <text class="t" x="70" y="295">重命名目录</text>
  <text class="t" x="70" y="315">fence_xxx → version.0</text>

  <rect class="atomic" x="340" y="95" width="620" height="200"/>
  <text class="h" x="370" y="130">原子性保证</text>
  <text class="t" x="370" y="155">要么全部成功：</text>
  <text class="t" x="390" y="175">- Version 写入成功</text>
  <text class="t" x="390" y="195">- 目录切换成功</text>
  <text class="t" x="390" y="215">- 版本提交完成</text>
  <text class="t" x="370" y="235">要么全部失败：</text>
  <text class="t" x="390" y="255">- 清理 Fence 目录</text>
  <text class="t" x="390" y="275">- 不影响已有版本</text>
  <text class="t" x="390" y="295">- 可以重试</text>

  <rect class="box" x="40" y="315" width="920" height="110"/>
  <text class="h" x="70" y="350">版本管理原子性的关键设计</text>
  <text class="t" x="70" y="375">1. Fence 机制：通过 Fence 目录保证版本提交的原子性，要么全部成功，要么全部失败</text>
  <text class="t" x="70" y="395">2. 原子切换：原子性地将 Fence 目录切换为正式版本目录，保证版本提交的原子性</text>
  <text class="t" x="70" y="415">3. 错误恢复：如果提交失败，可以清理 Fence 目录，不影响已有版本，可以重试</text>

  <text class="muted" x="40" y="440">版本管理的原子性通过 Fence 机制保证，保证版本提交的一致性</text>
</svg>
