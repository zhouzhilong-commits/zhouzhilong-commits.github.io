<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:12}
      .title{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .text{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .warn{fill:#fff8e6;stroke:#f39c12;stroke-width:2;rx:12}
      .good{fill:#f3fff5;stroke:#2ecc71;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">RocksDB：write buffer / flush / L0 / stall 的关系</text>
  <text class="muted" x="40" y="66">写入先落 memtable；flush 把 immutable 变成 L0；L0/compaction 欠账会触发 throttle/stall 保护。</text>

  <rect class="box" x="40" y="105" width="200" height="80"/>
  <text class="title" x="140" y="138" text-anchor="middle">Write()</text>
  <text class="muted" x="140" y="162" text-anchor="middle">WAL + MemTable</text>

  <path class="arrow" d="M 240 145 L 315 145"/>

  <rect class="good" x="320" y="90" width="220" height="110"/>
  <text class="title" x="430" y="122" text-anchor="middle">MemTable Budget</text>
  <text class="muted" x="430" y="148" text-anchor="middle">mutable → immutable</text>
  <text class="muted" x="430" y="170" text-anchor="middle">immutable 堆积 = flush 欠账</text>

  <path class="arrow" d="M 540 145 L 615 145"/>

  <rect class="good" x="620" y="90" width="160" height="110"/>
  <text class="title" x="700" y="122" text-anchor="middle">Flush</text>
  <text class="muted" x="700" y="148" text-anchor="middle">immutable → SST</text>
  <text class="muted" x="700" y="170" text-anchor="middle">落到 L0</text>

  <path class="arrow" d="M 780 145 L 850 145"/>

  <rect class="warn" x="855" y="90" width="85" height="110"/>
  <text class="title" x="897" y="122" text-anchor="middle">L0</text>
  <text class="muted" x="897" y="148" text-anchor="middle">文件堆积</text>
  <text class="muted" x="897" y="170" text-anchor="middle">读放大↑</text>

  <path class="arrow" d="M 897 200 L 897 240"/>

  <rect class="warn" x="620" y="235" width="320" height="80"/>
  <text class="title" x="780" y="268" text-anchor="middle">Compaction backlog</text>
  <text class="muted" x="780" y="292" text-anchor="middle">欠账越多 → 抖动越大</text>

  <path class="arrow" d="M 620 275 L 260 275"/>

  <rect class="warn" x="40" y="235" width="215" height="80"/>
  <text class="title" x="148" y="268" text-anchor="middle">throttle / stall</text>
  <text class="muted" x="148" y="292" text-anchor="middle">保护系统不崩</text>
</svg>
