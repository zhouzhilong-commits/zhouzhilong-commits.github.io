<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:12}
      .title{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .text{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .good{fill:#f3fff5;stroke:#2ecc71;stroke-width:2;rx:12}
      .warn{fill:#fff8e6;stroke:#f39c12;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">SSD / FTL：覆盖写 → 追加写 + 垃圾回收（GC）</text>
  <text class="muted" x="40" y="66">主机写 LBA，FTL 映射到物理页。覆盖写会产生无效页；GC 搬运有效页并擦除整块 → 设备写放大（Device WA）。</text>

  <rect class="box" x="40" y="105" width="210" height="90"/>
  <text class="title" x="145" y="138" text-anchor="middle">Host Write</text>
  <text class="muted" x="145" y="162" text-anchor="middle">4KB random overwrite</text>
  <text class="muted" x="145" y="182" text-anchor="middle">LBA = 100</text>

  <path class="arrow" d="M 250 150 L 320 150"/>

  <rect class="good" x="325" y="95" width="255" height="110"/>
  <text class="title" x="452" y="128" text-anchor="middle">FTL Mapping</text>
  <text class="muted" x="452" y="154" text-anchor="middle">LBA → PPA（物理页）</text>
  <text class="muted" x="452" y="174" text-anchor="middle">新数据写到“新页”</text>
  <text class="muted" x="452" y="194" text-anchor="middle">旧页标记为 invalid</text>

  <path class="arrow" d="M 580 150 L 655 150"/>

  <rect class="warn" x="660" y="95" width="280" height="110"/>
  <text class="title" x="800" y="128" text-anchor="middle">GC（搬运 + 擦除）</text>
  <text class="muted" x="800" y="154" text-anchor="middle">搬运仍有效的页</text>
  <text class="muted" x="800" y="174" text-anchor="middle">擦除整块（erase block）</text>
  <text class="muted" x="800" y="194" text-anchor="middle">回收 free space</text>

  <rect class="box" x="40" y="235" width="900" height="85"/>
  <text class="title" x="70" y="268">设备写放大（Device WA）怎么来的？</text>
  <text class="muted" x="70" y="292">覆盖写越分散 → invalid 页分散在更多 block → GC 搬运更多有效页 → 盘内写入字节增多 → 尾延迟更抖、寿命更敏感。</text>
</svg>
