<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:12}
      .title{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .text{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">RocksDB 写入路径（抽象版）</text>
  <text class="muted" x="40" y="66">Put/WriteBatch → WAL（可选 sync）→ MemTable（有序）→ Flush→ SST → Compaction</text>

  <rect class="box" x="40" y="105" width="160" height="90"/>
  <text class="title" x="120" y="138" text-anchor="middle">WriteBatch</text>
  <text class="muted" x="120" y="162" text-anchor="middle">seq / 组提交</text>
  <text class="muted" x="120" y="180" text-anchor="middle">并发合并</text>

  <path class="arrow" d="M 200 150 L 270 150"/>

  <rect class="box" x="275" y="70" width="170" height="90"/>
  <text class="title" x="360" y="103" text-anchor="middle">WAL</text>
  <text class="muted" x="360" y="127" text-anchor="middle">顺序追加</text>
  <text class="muted" x="360" y="145" text-anchor="middle">sync 可选</text>

  <rect class="box" x="275" y="180" width="170" height="90"/>
  <text class="title" x="360" y="213" text-anchor="middle">MemTable</text>
  <text class="muted" x="360" y="237" text-anchor="middle">skiplist</text>
  <text class="muted" x="360" y="255" text-anchor="middle">immutable 队列</text>

  <path class="arrow" d="M 445 115 L 520 115"/>
  <path class="arrow" d="M 445 225 L 520 225"/>

  <rect class="box" x="525" y="70" width="195" height="90"/>
  <text class="title" x="622" y="103" text-anchor="middle">Flush</text>
  <text class="muted" x="622" y="127" text-anchor="middle">MemTable→SST</text>
  <text class="muted" x="622" y="145" text-anchor="middle">生成 filter/index</text>

  <rect class="box" x="525" y="180" width="195" height="90"/>
  <text class="title" x="622" y="213" text-anchor="middle">Write Stall / Throttle</text>
  <text class="muted" x="622" y="237" text-anchor="middle">buffer 满/compaction</text>
  <text class="muted" x="622" y="255" text-anchor="middle">保护尾延迟</text>

  <path class="arrow" d="M 720 115 L 800 115"/>
  <path class="arrow" d="M 720 225 L 800 225"/>

  <rect class="box" x="805" y="70" width="150" height="200"/>
  <text class="title" x="880" y="105" text-anchor="middle">SST Levels</text>
  <text class="text" x="880" y="135" text-anchor="middle">L0/L1/L2…</text>
  <text class="muted" x="880" y="165" text-anchor="middle">Compaction</text>
  <text class="muted" x="880" y="185" text-anchor="middle">控制读放大</text>
  <text class="muted" x="880" y="205" text-anchor="middle">回收 tombstone</text>
</svg>

