<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000.0 529.0">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .step{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 1000.0 529.0" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">DiskSegment 加载流程：从 Open 到 GetIndexer 的完整过程</text>
  <text class="muted" x="40" y="66">DiskSegment 从磁盘加载索引数据，支持 NORMAL 和 LAZY 两种加载模式。</text>

  <rect class="step" x="40" y="95" width="180" height="134.0"/>
  <text class="h" x="70" y="130">1. Open</text>
  <text class="t" x="70" y="155">打开 Segment 目录</text>
  <text class="t" x="70" y="175">读取 SegmentInfo</text>
  <text class="t" x="70" y="195">初始化资源</text>

  <path class="arrow" d="M 220 145 L 260 145"/>

  <rect class="step" x="270" y="95" width="200" height="134.0"/>
  <text class="h" x="300" y="130">2. OpenIndexer</text>
  <text class="t" x="300" y="155">NORMAL: 立即打开</text>
  <text class="t" x="300" y="175">LAZY: 延迟打开</text>
  <text class="t" x="300" y="195">创建 Indexer</text>

  <path class="arrow" d="M 470 145 L 510 145"/>

  <rect class="step" x="520" y="95" width="180" height="134.0"/>
  <text class="h" x="550" y="130">3. GetIndexer</text>
  <text class="t" x="550" y="155">查询时获取</text>
  <text class="t" x="550" y="175">LAZY 模式下</text>
  <text class="t" x="550" y="195">此时才加载</text>

  <path class="arrow" d="M 700 145 L 740 145"/>

  <rect class="step" x="750" y="95" width="210" height="134.0"/>
  <text class="h" x="780" y="130">4. Reopen</text>
  <text class="t" x="780" y="155">Schema 变更时</text>
  <text class="t" x="780" y="175">重新打开</text>
  <text class="t" x="780" y="195">更新 Indexer</text>

  <rect class="box" x="40" y="215" width="920" height="274.0"/>
  <text class="h" x="70" y="250">详细流程说明</text>
  <text class="t" x="70" y="275">1. Open：调用 Open(MemoryQuotaController, OpenMode)，打开 Segment 目录，读取 SegmentInfo（docCount、Locator 等），初始化内存配额控制器</text>
  <text class="t" x="70" y="295">2. OpenIndexer：根据 OpenMode 决定加载策略：NORMAL 模式立即调用 OpenIndexer() 打开所有 Indexer，LAZY 模式只准备 Indexer 配置，不实际加载</text>
  <text class="t" x="70" y="315">3. GetIndexer：查询时调用 GetIndexer(type, name)，NORMAL 模式直接从 _indexMap 获取已加载的 Indexer，LAZY 模式此时才调用 OpenIndexer() 加载对应的 Indexer</text>
  <text class="t" x="70" y="335">4. Reopen：当 Schema 变更时，调用 Reopen(schemas)，重新打开 Indexer，处理 Schema 变更（添加新索引、删除旧索引、更新索引配置等）</text>
  <text class="t" x="70" y="355">关键点：NORMAL 模式适合在线查询，保证低延迟，但内存占用大</text>
  <text class="t" x="70" y="375">关键点：LAZY 模式适合离线处理，节省内存，但首次查询有加载延迟</text>
  <text class="t" x="70" y="395">关键点：Indexer 的加载是线程安全的，通过 _indexMapLock 保护 _indexMap 的并发访问</text>
  <text class="t" x="70" y="415">关键点：LAZY 模式下，不常用的 Indexer 可以被卸载，释放内存，需要时重新加载</text>
  <text class="t" x="70" y="435">关键点：Reopen 支持 Schema 演进，可以处理索引的添加、删除、修改等操作</text>
  <text class="t" x="70" y="455">关键点：DiskSegment 的 Indexer 通过智能指针管理，自动释放资源，支持按需加载和卸载</text>
</svg>
