<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .lvalue{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
      .rvalue{fill:#fff3e0;stroke:#e65100;stroke-width:2;rx:12}
      .copy{fill:#ffebee;stroke:#c62828;stroke-width:2;rx:12}
      .move{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">移动语义：左值 vs 右值，拷贝 vs 移动</text>
  <text class="muted" x="40" y="66">左值有名字可寻址，右值是临时对象。移动语义通过转移所有权避免昂贵的拷贝操作。</text>

  <rect class="lvalue" x="40" y="95" width="200" height="150"/>
  <text class="h" x="70" y="130">左值（lvalue）</text>
  <text class="t" x="70" y="155">- 有名字的表达式</text>
  <text class="t" x="70" y="175">- 可以取地址</text>
  <text class="t" x="70" y="195">- 绑定到左值引用 &amp;</text>
  <text class="t" x="70" y="215">- 示例：变量、函数参数</text>

  <rect class="rvalue" x="260" y="95" width="200" height="150"/>
  <text class="h" x="290" y="130">右值（rvalue）</text>
  <text class="t" x="290" y="155">- 临时对象</text>
  <text class="t" x="290" y="175">- 字面量</text>
  <text class="t" x="290" y="195">- 函数返回值</text>
  <text class="t" x="290" y="215">- 绑定到右值引用 &amp;&amp;</text>

  <path class="arrow" d="M 460 170 L 540 170"/>

  <rect class="copy" x="550" y="95" width="180" height="120"/>
  <text class="h" x="580" y="130">拷贝语义</text>
  <text class="t" x="580" y="155">- 深拷贝数据</text>
  <text class="t" x="580" y="175">- O(n) 时间空间</text>
  <text class="t" x="580" y="195">- 两个对象独立</text>

  <rect class="move" x="550" y="230" width="180" height="120"/>
  <text class="h" x="580" y="265">移动语义</text>
  <text class="t" x="580" y="290">- 转移所有权</text>
  <text class="t" x="580" y="310">- O(1) 时间</text>
  <text class="t" x="580" y="330">- 源对象置空</text>

  <rect class="box" x="40" y="370" width="690" height="100"/>
  <text class="h" x="70" y="405">性能对比（大对象）</text>
  <text class="t" x="70" y="430">拷贝：分配新内存 + 复制数据（100 万个元素 = 4MB 拷贝）</text>
  <text class="t" x="70" y="450">移动：只转移指针（几个字节的指针赋值）</text>
  <text class="t" x="70" y="470">移动语义可以带来数量级的性能提升</text>
</svg>
