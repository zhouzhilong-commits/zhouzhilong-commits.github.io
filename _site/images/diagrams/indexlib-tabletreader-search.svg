<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000.0 549.0">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .step{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
      .result{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 1000.0 549.0" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">TabletReader::Search() 流程：从 JSON 查询到结果返回</text>
  <text class="muted" x="40" y="66">Search() 方法将 JSON 查询转换为结果，包括解析查询、获取 IndexReader、遍历 Segment、并行查询、合并结果等步骤。</text>

  <rect class="step" x="40" y="95" width="160" height="134.0"/>
  <text class="h" x="70" y="130">1. 解析查询</text>
  <text class="t" x="70" y="155">JSON → 查询对象</text>
  <text class="t" x="70" y="175">提取查询类型</text>
  <text class="t" x="70" y="195">和条件</text>

  <path class="arrow" d="M 200 145 L 240 145"/>

  <rect class="step" x="260" y="95" width="180" height="134.0"/>
  <text class="h" x="290" y="130">2. 获取 IndexReader</text>
  <text class="t" x="290" y="155">根据索引类型</text>
  <text class="t" x="290" y="175">和名称获取</text>
  <text class="t" x="290" y="195">（带缓存）</text>

  <path class="arrow" d="M 440 145 L 480 145"/>

  <rect class="step" x="500" y="95" width="180" height="134.0"/>
  <text class="h" x="530" y="130">3. 遍历 Segment</text>
  <text class="t" x="530" y="155">TabletData-></text>
  <text class="t" x="530" y="175">CreateSlice(ST_BUILT)</text>
  <text class="t" x="530" y="195">获取所有已构建 Segment</text>

  <path class="arrow" d="M 680 145 L 720 145"/>

  <rect class="step" x="740" y="95" width="160" height="134.0"/>
  <text class="h" x="770" y="130">4. 并行查询</text>
  <text class="t" x="770" y="155">对每个 Segment</text>
  <text class="t" x="770" y="175">调用 Indexer</text>
  <text class="t" x="770" y="195">查询</text>

  <path class="arrow" d="M 770 195 L 770 225"/>

  <rect class="step" x="40" y="235" width="160" height="134.0"/>
  <text class="h" x="70" y="270">5. 合并结果</text>
  <text class="t" x="70" y="295">去重、排序</text>
  <text class="t" x="70" y="315">聚合统计</text>
  <text class="t" x="70" y="335.0">分页处理</text>

  <path class="arrow" d="M 200 285 L 240 285"/>

  <rect class="result" x="260" y="235" width="160" height="114.0"/>
  <text class="h" x="290" y="270">6. 返回结果</text>
  <text class="t" x="290" y="295">序列化为 JSON</text>
  <text class="t" x="290" y="315">返回给调用者</text>

  <rect class="box" x="440" y="235" width="460" height="274.0"/>
  <text class="h" x="470" y="270">Search 流程的关键代码逻辑</text>
  <text class="t" x="470" y="295">// 1. 解析查询</text>
  <text class="t" x="470" y="315">Query query = ParseJsonQuery(jsonQuery);</text>
  <text class="t" x="470" y="335">// 2. 获取 IndexReader（带缓存）</text>
  <text class="t" x="470" y="355">auto reader = GetIndexReader(query.indexType, query.indexName);</text>
  <text class="t" x="470" y="375">// 3. 获取所有已构建的 Segment</text>
  <text class="t" x="470" y="395">auto segments = tabletData->CreateSlice(ST_BUILT);</text>
  <text class="t" x="470" y="415">// 4. 遍历 Segment 查询并合并结果</text>
  <text class="t" x="470" y="435">for (auto&amp; seg : segments) {</text>
  <text class="t" x="490" y="455">    results.merge(reader->Search(seg));</text>
  <text class="t" x="470" y="475">}</text>

  <text class="muted" x="40" y="450">Search 流程是查询的核心，需要高效地处理查询请求</text>
</svg>
