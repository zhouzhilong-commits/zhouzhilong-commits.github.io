<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .version{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
      .clean{fill:#fff3e0;stroke:#e65100;stroke-width:2;rx:12}
      .keep{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2;rx:12}
    </style>
  </defs>

  <text class="title" x="40" y="42">版本清理：清理不再需要的旧版本文件</text>
  <text class="muted" x="40" y="66">版本清理用于清理不再需要的旧版本文件，包括版本文件、Segment 文件、索引文件等，释放存储空间。</text>

  <rect class="version" x="40" y="95" width="180" height="120"/>
  <text class="h" x="70" y="130">Version 1</text>
  <text class="t" x="70" y="155">Segments: [1, 2]</text>
  <text class="t" x="70" y="175">旧版本</text>
  <text class="t" x="70" y="195">可以清理</text>

  <rect class="version" x="240" y="95" width="180" height="120"/>
  <text class="h" x="270" y="130">Version 2</text>
  <text class="t" x="270" y="155">Segments: [3, 4]</text>
  <text class="t" x="270" y="175">旧版本</text>
  <text class="t" x="270" y="195">可以清理</text>

  <rect class="keep" x="440" y="95" width="180" height="120"/>
  <text class="h" x="470" y="130">Version 3</text>
  <text class="t" x="470" y="155">Segments: [5, 6]</text>
  <text class="t" x="470" y="175">保留版本</text>
  <text class="t" x="470" y="195">不清理</text>

  <rect class="keep" x="640" y="95" width="180" height="120"/>
  <text class="h" x="670" y="130">Version 4</text>
  <text class="t" x="670" y="155">Segments: [7, 8]</text>
  <text class="t" x="670" y="175">当前版本</text>
  <text class="t" x="670" y="195">不清理</text>

  <rect class="clean" x="40" y="235" width="900" height="255.0"/>
  <text class="h" x="70" y="270">版本清理的关键步骤</text>
  <text class="t" x="70" y="295">1. 保留版本列表：保留指定数量的版本（如最近 3 个版本），清理其他版本</text>
  <text class="t" x="70" y="315">2. 清理版本文件：清理不再被保留的版本文件（version.0、version.1 等）</text>
  <text class="t" x="70" y="335">3. 清理 Segment：清理不再被任何版本引用的 Segment，释放存储空间</text>
  <text class="t" x="70" y="355">4. 清理索引文件：清理不再使用的索引文件，释放存储空间</text>
  <text class="t" x="70" y="375">5. 清理时机：在 Commit 时或定期清理，避免存储空间浪费</text>
  <text class="t" x="70" y="395">6. 清理范围：清理版本文件、Segment 文件、索引文件等，释放存储空间</text>
  <text class="t" x="70" y="415">关键设计：版本清理是存储管理的关键，需要平衡存储空间和版本保留数量</text>
  <text class="t" x="70" y="435">关键设计：版本清理需要保证不会清理正在使用的版本和 Segment，保证系统的稳定性</text>
  <text class="t" x="70" y="455">关键设计：版本清理支持配置保留版本数量，灵活适应不同场景的存储需求</text>

  <text class="muted" x="40" y="470">版本清理是存储管理的关键，需要平衡存储空间和版本保留数量</text>
</svg>
