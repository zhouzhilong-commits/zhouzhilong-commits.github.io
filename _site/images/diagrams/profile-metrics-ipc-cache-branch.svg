<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .t{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
    </style>
  </defs>

  <text class="title" x="40" y="42">Profile 指标：IPC 被什么拖低？</text>
  <text class="muted" x="40" y="66">直觉：IPC 低通常不是“CPU 不够快”，而是流水线在等（cache miss / branch miss / 前端喂不饱）。</text>

  <rect class="box" x="40" y="95" width="900" height="235"/>
  <text class="t" x="70" y="135">- IPC（Instructions Per Cycle）↓：每个周期退休的指令少</text>
  <text class="t" x="70" y="165">- cache miss ↑：L1/L2/LLC miss 让流水线等待内存（stalled cycles ↑）</text>
  <text class="t" x="70" y="195">- branch miss ↑：预测失败导致流水线 flush（浪费已做的工作）</text>
  <text class="t" x="70" y="225">- 观测思路：先看 stalled cycles，再看 miss 类型与热点函数</text>
  <text class="muted" x="70" y="260">常用工具：perf stat/perf record、pmu events、火焰图（CPU/Off-CPU）</text>
</svg>

