<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .strategy{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
    </style>
  </defs>

  <text class="title" x="40" y="42">版本清理策略：保留版本数量、清理时机等</text>
  <text class="muted" x="40" y="66">版本清理的策略包括保留版本数量、清理时机、清理范围等，需要平衡存储空间和版本保留数量。</text>

  <rect class="strategy" x="40" y="95" width="280" height="120"/>
  <text class="h" x="70" y="130">保留版本数</text>
  <text class="t" x="70" y="155">保留最近 N 个版本</text>
  <text class="t" x="70" y="175">（如 N=3）</text>
  <text class="t" x="70" y="195">清理其他版本</text>
  <text class="t" x="70" y="215">释放存储空间</text>

  <rect class="strategy" x="340" y="95" width="280" height="120"/>
  <text class="h" x="370" y="130">清理时机</text>
  <text class="t" x="370" y="155">在 Commit 时清理</text>
  <text class="t" x="370" y="175">或定期清理</text>
  <text class="t" x="370" y="195">避免存储空间浪费</text>
  <text class="t" x="370" y="215">提高清理效率</text>

  <rect class="strategy" x="640" y="95" width="320" height="120"/>
  <text class="h" x="670" y="130">清理范围</text>
  <text class="t" x="670" y="155">版本文件、Segment 文件</text>
  <text class="t" x="670" y="175">索引文件等</text>
  <text class="t" x="670" y="195">释放存储空间</text>
  <text class="t" x="670" y="215">提高存储效率</text>

  <rect class="box" x="40" y="235" width="920" height="180"/>
  <text class="h" x="70" y="270">版本清理策略的关键设计</text>
  <text class="t" x="70" y="295">1. 保留版本数：保留最近 N 个版本（如 N=3），清理其他版本，平衡存储空间和版本保留数量</text>
  <text class="t" x="70" y="315">2. 清理时机：在 Commit 时或定期清理，避免存储空间浪费，提高清理效率</text>
  <text class="t" x="70" y="335">3. 清理范围：清理版本文件、Segment 文件、索引文件等，释放存储空间，提高存储效率</text>
  <text class="t" x="70" y="355">4. 安全保证：版本清理需要保证不会清理正在使用的版本和 Segment，保证系统的稳定性</text>
  <text class="t" x="70" y="375">5. 配置灵活：版本清理支持配置保留版本数量，灵活适应不同场景的存储需求</text>
  <text class="t" x="70" y="395">6. 性能优化：版本清理支持异步清理，不阻塞正常操作，提高系统性能</text>
  <text class="t" x="70" y="415">关键设计：版本清理是存储管理的关键，需要平衡存储空间和版本保留数量，保证系统的稳定性</text>

  <text class="muted" x="40" y="430">版本清理策略需要平衡存储空间和版本保留数量，保证系统的稳定性</text>
</svg>
