<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .type{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
    </style>
  </defs>

  <text class="title" x="40" y="42">不同类型的 IndexReader：倒排索引、正排索引、主键索引等</text>
  <text class="muted" x="40" y="66">IndexLib 支持多种类型的 IndexReader，每种类型提供不同的索引查询能力。</text>

  <rect class="type" x="40" y="95" width="220" height="154.0"/>
  <text class="h" x="70" y="130">InvertedIndexReader</text>
  <text class="t" x="70" y="155">倒排索引 Reader</text>
  <text class="t" x="70" y="175">用于全文检索</text>
  <text class="t" x="70" y="195">term 查询</text>
  <text class="t" x="70" y="215">返回 DocId 列表</text>

  <rect class="type" x="280" y="95" width="220" height="154.0"/>
  <text class="h" x="310" y="130">AttributeReader</text>
  <text class="t" x="310" y="155">正排索引 Reader</text>
  <text class="t" x="310" y="175">用于属性查询</text>
  <text class="t" x="310" y="195">属性值查询</text>
  <text class="t" x="310" y="215">返回属性值</text>

  <rect class="type" x="520" y="95" width="220" height="154.0"/>
  <text class="h" x="550" y="130">PrimaryKeyReader</text>
  <text class="t" x="550" y="155">主键索引 Reader</text>
  <text class="t" x="550" y="175">用于主键查询</text>
  <text class="t" x="550" y="195">主键定位</text>
  <text class="t" x="550" y="215">返回 DocId</text>

  <rect class="type" x="760" y="95" width="200" height="134.0"/>
  <text class="h" x="790" y="130">SummaryReader</text>
  <text class="t" x="790" y="155">摘要 Reader</text>
  <text class="t" x="790" y="175">用于获取文档摘要</text>
  <text class="t" x="790" y="195">返回摘要信息</text>

  <rect class="type" x="40" y="235" width="220" height="134.0"/>
  <text class="h" x="70" y="270">DeletionMapReader</text>
  <text class="t" x="70" y="295">删除映射 Reader</text>
  <text class="t" x="70" y="315">用于过滤已删除文档</text>
  <text class="t" x="70" y="335">判断文档是否删除</text>

  <rect class="type" x="280" y="235" width="220" height="134.0"/>
  <text class="h" x="310" y="270">SourceReader</text>
  <text class="t" x="310" y="295">源数据 Reader</text>
  <text class="t" x="310" y="315">用于获取原始文档</text>
  <text class="t" x="310" y="335">返回原始文档数据</text>

  <rect class="type" x="520" y="235" width="220" height="134.0"/>
  <text class="h" x="550" y="270">FieldMetaReader</text>
  <text class="t" x="550" y="295">字段元数据 Reader</text>
  <text class="t" x="550" y="315">用于获取字段元数据</text>
  <text class="t" x="550" y="335">返回字段统计信息</text>

  <rect class="box" x="760" y="235" width="200" height="234.0"/>
  <text class="h" x="790" y="270">其他类型</text>
  <text class="t" x="790" y="295">- BitmapIndexReader</text>
  <text class="t" x="790" y="315">- RangeIndexReader</text>
  <text class="t" x="790" y="335">- DateIndexReader</text>
  <text class="t" x="790" y="355">- SpatialIndexReader</text>
  <text class="t" x="790" y="375">- KVIndexReader</text>
  <text class="t" x="790" y="395">- KKVIndexReader</text>
  <text class="t" x="790" y="415">- AithetaIndexReader</text>
  <text class="t" x="790" y="435">（向量检索）</text>

  <text class="muted" x="40" y="480">不同类型的 IndexReader 提供不同的索引查询能力，支持各种查询场景</text>
</svg>
