<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}
      .rt{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
      .merged{fill:#fff3e0;stroke:#e65100;stroke-width:2;rx:12}
      .bit{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2;rx:12}
    </style>
    <marker id="m" viewBox="0 0 1000 465" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="40" y="42">Segment ID 分类：实时 Segment、合并 Segment 的 ID 分配规则</text>
  <text class="muted" x="40" y="66">通过位掩码区分不同类型的 Segment，支持实时写入和合并操作。</text>

  <rect class="bit" x="40" y="95" width="920" height="120"/>
  <text class="h" x="70" y="130">Segment ID 位掩码</text>
  <text class="t" x="70" y="155">位 31  30  29  28  ...  0</text>
  <text class="t" x="70" y="175">RT_SEGMENT_ID_MASK:    位 30 = 1（实时 Segment）</text>
  <text class="t" x="70" y="195">PUBLIC_SEGMENT_ID_MASK: 位 29 = 1（公共 Segment）</text>
  <text class="t" x="70" y="215">MERGED_SEGMENT_ID_MASK: 位 29,30 = 0（合并 Segment）</text>

  <rect class="rt" x="40" y="235" width="420" height="180"/>
  <text class="h" x="70" y="270">实时 Segment（RT Segment）</text>
  <text class="t" x="70" y="295">ID 特征：位 30 = 1</text>
  <text class="t" x="70" y="315">示例：0x40000001</text>
  <text class="t" x="70" y="335">用途：实时写入</text>
  <text class="t" x="70" y="355">特点：</text>
  <text class="t" x="90" y="375">- 在内存中构建</text>
  <text class="t" x="90" y="395">- 支持实时查询</text>
  <text class="t" x="90" y="415">- 定期转储为 DiskSegment</text>

  <rect class="merged" x="480" y="235" width="480" height="180"/>
  <text class="h" x="510" y="270">合并 Segment（Merged Segment）</text>
  <text class="t" x="510" y="295">ID 特征：位 29,30 = 0</text>
  <text class="t" x="510" y="315">示例：0x00000001, 0x00000002</text>
  <text class="t" x="510" y="335">用途：合并后的 Segment</text>
  <text class="t" x="510" y="355">特点：</text>
  <text class="t" x="530" y="375">- 存储在磁盘上</text>
  <text class="t" x="530" y="395">- 由多个 Segment 合并而成</text>
  <text class="t" x="530" y="415">- 可以长期保存</text>
</svg>
