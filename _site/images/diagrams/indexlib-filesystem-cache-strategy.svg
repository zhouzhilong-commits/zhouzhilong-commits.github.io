<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490">
  <defs>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:14}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#111}
      .h{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#222}
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#333}
      .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;fill:#666}
      .strategy{fill:#e3f2fd;stroke:#1976d2;stroke-width:2;rx:12}
    </style>
  </defs>

  <text class="title" x="40" y="42">文件系统缓存策略：LRU、LFU 等缓存策略</text>
  <text class="muted" x="40" y="66">文件系统缓存支持多种缓存策略，包括 LRU、LFU、按需缓存、预取缓存等。</text>

  <rect class="strategy" x="40" y="95" width="220" height="200"/>
  <text class="h" x="70" y="130">LRU</text>
  <text class="t" x="70" y="155">最近最少使用</text>
  <text class="t" x="70" y="175">淘汰最久未使用</text>
  <text class="t" x="70" y="195">的缓存</text>
  <text class="t" x="70" y="215">适用于时间局部性</text>
  <text class="t" x="70" y="235">性能好</text>
  <text class="t" x="70" y="255">实现简单</text>
  <text class="t" x="70" y="275">广泛应用</text>

  <rect class="strategy" x="280" y="95" width="220" height="200"/>
  <text class="h" x="310" y="130">LFU</text>
  <text class="t" x="310" y="155">最不经常使用</text>
  <text class="t" x="310" y="175">淘汰使用频率</text>
  <text class="t" x="310" y="195">最低的缓存</text>
  <text class="t" x="310" y="215">适用于频率局部性</text>
  <text class="t" x="310" y="235">性能好</text>
  <text class="t" x="310" y="255">实现复杂</text>
  <text class="t" x="310" y="275">适用场景少</text>

  <rect class="strategy" x="520" y="95" width="220" height="200"/>
  <text class="h" x="550" y="130">按需缓存</text>
  <text class="t" x="550" y="155">根据访问模式</text>
  <text class="t" x="550" y="175">按需缓存</text>
  <text class="t" x="550" y="195">灵活适应</text>
  <text class="t" x="550" y="215">不同场景</text>
  <text class="t" x="550" y="235">性能好</text>
  <text class="t" x="550" y="255">实现复杂</text>
  <text class="t" x="550" y="275">适用场景多</text>

  <rect class="strategy" x="760" y="95" width="200" height="200"/>
  <text class="h" x="790" y="130">预取缓存</text>
  <text class="t" x="790" y="155">预取可能访问</text>
  <text class="t" x="790" y="175">的文件</text>
  <text class="t" x="790" y="195">提前加载数据</text>
  <text class="t" x="790" y="215">提高命中率</text>
  <text class="t" x="790" y="235">性能好</text>
  <text class="t" x="790" y="255">实现复杂</text>
  <text class="t" x="790" y="275">适用场景多</text>

  <rect class="box" x="40" y="315" width="920" height="145.0"/>
  <text class="h" x="70" y="350">文件系统缓存策略的关键特点</text>
  <text class="t" x="70" y="375">1. LRU：最近最少使用策略，淘汰最久未使用的缓存，适用于时间局部性，性能好，实现简单</text>
  <text class="t" x="70" y="395">2. LFU：最不经常使用策略，淘汰使用频率最低的缓存，适用于频率局部性，性能好，实现复杂</text>

  <text class="muted" x="40" y="440">理解文件系统缓存策略，是优化缓存性能的关键</text>
</svg>
